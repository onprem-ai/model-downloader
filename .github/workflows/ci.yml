name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_GIST_SECRET: ${{ secrets.GIST_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync python -m pytest -q --cov=opai_models --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90
      - name: Extract coverage percentage
        id: coverage
        run: |
          percentage=$(python -c 'import json; print(round(json.load(open("coverage.json"))["totals"]["percent_covered"]))')
          echo "percentage=$percentage" >> "$GITHUB_OUTPUT"
      - name: Update coverage badge
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.HAS_GIST_SECRET == 'true'
        uses: schneegans/dynamic-badges-action@0e50b8bad39e7e1afd3e4e9c2b7dd145fad07501 # v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: a86fb4ad5e2ecb21c0a53493264f8e4c
          filename: model-downloader-coverage.json
          label: Coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 100
      - run: uv build
